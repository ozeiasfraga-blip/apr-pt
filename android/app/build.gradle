plugins {
    id 'com.android.application'
}

android {
    namespace 'br.net.nwt.aprpt'
    compileSdk 36

    defaultConfig {
        applicationId 'br.net.nwt.aprpt'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.3.1'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // Mesma chave usada no APK anterior (permite atualizar por cima, sem desinstalar).
            storeFile file("${rootDir}/android.keystore")
            storePassword 'AprPT@2026'
            keyAlias 'android'
            keyPassword 'AprPT@2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Antes de compilar, atualiza o "casco" do app (HTML/CSS/JS) dentro do APK.
// É o que permite abrir o app sem internet.
tasks.register('syncWeb', Exec) {
    workingDir "${rootDir}"
    commandLine 'sh', "${rootDir}/tools/sync-web.sh"
}
preBuild.dependsOn('syncWeb')
