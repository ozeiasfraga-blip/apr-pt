plugins {
    id 'com.android.application'
}

// Segredos de assinatura ficam em android/keystore.properties (NÃO versionado).
// Sem ele o build de debug funciona; o de release falha com aviso claro.
def keystoreProps = new Properties()
def keystorePropsFile = file("${rootDir}/keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'br.net.nwt.aprpt'
    compileSdk 36

    defaultConfig {
        applicationId 'br.net.nwt.aprpt'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.3.2'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // Mesma chave usada no APK anterior (permite atualizar por cima, sem desinstalar).
            // Senha NÃO fica aqui: vem de ../keystore.properties.
            storeFile file("${rootDir}/" + (keystoreProps.getProperty('storeFile') ?: 'android.keystore'))
            storePassword keystoreProps.getProperty('storePassword')
            keyAlias keystoreProps.getProperty('keyAlias')
            keyPassword keystoreProps.getProperty('keyPassword')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // FileProvider (foto de perfil: câmera via <input type=file>)
    implementation 'androidx.core:core:1.13.1'
}

// Antes de compilar, atualiza o "casco" do app (HTML/CSS/JS) dentro do APK.
// É o que permite abrir o app sem internet.
tasks.register('syncWeb', Exec) {
    workingDir "${rootDir}"
    commandLine 'sh', "${rootDir}/tools/sync-web.sh"
}
preBuild.dependsOn('syncWeb')
